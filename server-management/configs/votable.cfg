// =============================================================================
// votable.cfg — Votable (multi-gametype) server
// g_gametype, net_port, sv_hostname, sv_maxclients set via CLI 
// =============================================================================
exec configs/_base.cfg
set logconsole "wfconsole-votable.log"

set sv_defaultmap "wfdm1"
set g_votable_gametypes "bomb ca ctf ctftactics da dm duel ffa headhunt race rekt tdm"

// Custom maps shipped in server-management/downloads/ — clients pull these over
// HTTP (sv_http / sv_uploads_from_server in _base.cfg) on connect.
set g_maplist "wfdm1 rats_waitingroom 36dm2_b1 scduel1a3 whatsparadigmb3 BabyImWet stwsw abandoned"
set g_maprotation "1"                 // 0 = stay, 1 = in order, 2 = random
set g_disable_vote_gametype "0"       // override base: allow gametype votes

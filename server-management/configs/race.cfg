exec configs/_base.cfg
set logconsole "wfconsole-race.log"

set sv_defaultmap "wfrace1"
set g_votable_gametypes "race"

// No validated race maps are currently shipped in server-management/downloads/.
set g_maplist "wfrace1"
set g_maprotation "1"
